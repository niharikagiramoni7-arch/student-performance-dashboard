server.port=${PORT:8080}
spring.application.name=student-performance-dashboard

# Primary MySQL Datasource with environment variables
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:student_performance_db}?sslMode=${MYSQL_SSL_MODE:DISABLED}&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Resend Transactional Email Service (Primary & Default)
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from-email=${EMAIL_FROM:onboarding@resend.dev}
app.mail.from-name=${EMAIL_FROM_NAME:Student Performance Dashboard}

# Security & JWT
app.security.admin-email=${ADMIN_EMAIL:niharikagiramoni7@gmail.com}
app.security.admin-password=${ADMIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
